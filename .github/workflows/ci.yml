name: CI

# Gates merges into main. The job name "Build & test" is what the main ruleset
# requires, and what auto-merge waits for, so keep it stable. See
# CONTRIBUTING.md, "Required check and merging".
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what the lockfile says and fails if
      # package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      # ESLint, the MPL 2.0 header check (docs/license-headers.md) and the guard
      # against committed DICOM files (docs/test-data.md).
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # Runners have no GPU. Tests must pass without WebGPU.
      - name: Test
        run: npm test

      # Catches a build or test step that rewrites tracked files, such as a
      # lockfile that npm would regenerate differently.
      - name: Working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The build changed tracked files. Commit the result of running it locally."
            git status --short
            git diff --stat
            exit 1
          fi
