name: CI

# Gates merges into main. The job names "Build & test" and "End-to-end smoke"
# are what the main ruleset requires, and what auto-merge waits for, so keep
# them stable. See CONTRIBUTING.md, "Required checks and merging".
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what the lockfile says and fails if
      # package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      # ESLint, the MPL 2.0 header check (docs/license-headers.md) and the guard
      # against committed DICOM files (docs/test-data.md).
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # Runners have no GPU. Tests must pass without WebGPU.
      - name: Test
        run: npm test

      # Catches a build or test step that rewrites tracked files, such as a
      # lockfile that npm would regenerate differently.
      - name: Working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The build changed tracked files. Commit the result of running it locally."
            git status --short
            git diff --stat
            exit 1
          fi

  # The smoke tests in Chromium: the notice flow, loading a synthetic series,
  # a probe value and a WebGPU device. Required by the main ruleset, so it runs
  # only apps/web/e2e/smoke.spec.ts and stays short. Runners have no GPU, so
  # Chromium is asked for a software WebGPU adapter. E2E_REQUIRE_WEBGPU makes a
  # missing adapter a failure here: a required check must not pass because its
  # tests were skipped.
  e2e-smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # Playwright starts the dev server itself and waits for it.
      - name: Smoke tests
        run: npm run e2e:smoke
        env:
          E2E_SOFTWARE_GPU: '1'
          E2E_REQUIRE_WEBGPU: '1'

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-failures
          path: |
            apps/web/test-results/
            e2e.log
          retention-days: 7
          if-no-files-found: ignore

  # The whole end-to-end suite. Not a required check: the main ruleset requires
  # "Build & test" and "End-to-end smoke". Runners have no GPU, so the tests ask
  # Chromium for a software WebGPU adapter, and anything that still finds no
  # adapter reports as skipped (see apps/web/e2e/fixtures/app.ts, requireWebGpu).
  e2e:
    name: End-to-end (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            args: ''
          - variant: use-vulkan-swiftshader
            args: '--use-vulkan=swiftshader'
          - variant: angle-vulkan
            args: '--use-angle=vulkan --disable-vulkan-surface'
          - variant: angle-vulkan-swiftshader
            args: '--use-angle=vulkan --use-vulkan=swiftshader --disable-vulkan-surface'
          - variant: vulkan-swiftshader-no-surface
            args: '--use-vulkan=swiftshader --disable-vulkan-surface'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # Playwright starts the dev server itself and waits for it.
      - name: End-to-end tests
        run: bash scripts/diag-e2e.sh
        env:
          E2E_SOFTWARE_GPU: '1'
          E2E_EXTRA_ARGS: ${{ matrix.args }}
          DEBUG: 'pw:browser'

      # Traces and screenshots of failed tests, and the HTML report.
      - name: Upload failure artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ matrix.variant }}
          path: |
            apps/web/test-results/
            e2e.log
          retention-days: 7
          if-no-files-found: ignore
