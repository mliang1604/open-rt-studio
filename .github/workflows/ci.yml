name: CI

# Gates merges into main. The job name "Build & test" is what branch protection
# requires, and what auto-merge waits for, so keep it stable.
#
# Until the monorepo scaffold lands there is no package.json, so the npm steps
# are skipped and the job passes. Once package.json exists they run for real;
# each script is optional (--if-present) until the scaffold defines it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect workspace
        id: ws
        run: |
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; else echo "node=false" >> "$GITHUB_OUTPUT"; fi

      - name: Nothing to build yet
        if: steps.ws.outputs.node != 'true'
        run: echo "No package.json yet; build and test steps are skipped."

      - name: Set up Node
        if: steps.ws.outputs.node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci fails if package.json and the lockfile disagree.
      - name: Install
        if: steps.ws.outputs.node == 'true'
        run: npm ci

      - name: Lint
        if: steps.ws.outputs.node == 'true'
        run: npm run lint --if-present

      - name: Format check
        if: steps.ws.outputs.node == 'true'
        run: npm run format:check --if-present

      - name: Build
        if: steps.ws.outputs.node == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.ws.outputs.node == 'true'
        run: npm test --if-present
