name: CI

# Gates merges into main. The job names "Build & test" and "End-to-end smoke"
# are what the main ruleset requires, and what auto-merge waits for, so keep
# them stable. See CONTRIBUTING.md, "Required checks and merging".
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci installs exactly what the lockfile says and fails if
      # package.json and the lockfile disagree.
      - name: Install
        run: npm ci

      # ESLint, the MPL 2.0 header check (docs/license-headers.md) and the guard
      # against committed DICOM files (docs/test-data.md).
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # Runners have no GPU. Tests must pass without WebGPU.
      - name: Test
        run: npm test

      # Catches a build or test step that rewrites tracked files, such as a
      # lockfile that npm would regenerate differently.
      - name: Working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The build changed tracked files. Commit the result of running it locally."
            git status --short
            git diff --stat
            exit 1
          fi

  # The smoke tests in Chromium: the notice flow, loading a synthetic series,
  # a probe value and a WebGPU device. Required by the main ruleset, so it runs
  # only apps/web/e2e/smoke.spec.ts and stays short. Runners have no GPU, so
  # Chromium is asked for a software WebGPU adapter. E2E_REQUIRE_WEBGPU makes a
  # missing adapter a failure here: a required check must not pass because its
  # tests were skipped.
  e2e-smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # Playwright starts the dev server itself and waits for it.
      - name: Smoke tests
        run: npm run e2e:smoke
        env:
          E2E_SOFTWARE_GPU: '1'
          E2E_REQUIRE_WEBGPU: '1'

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-failures
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The whole end-to-end suite. Not a required check: the main ruleset requires
  # "Build & test" and "End-to-end smoke". Runners have no GPU, so the tests ask
  # Chromium for a software WebGPU adapter, and anything that still finds no
  # adapter reports as skipped (see apps/web/e2e/fixtures/app.ts, requireWebGpu).
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # Playwright starts the dev server itself and waits for it.
      - name: End-to-end tests
        run: npm run e2e
        env:
          E2E_SOFTWARE_GPU: '1'

      # Traces and screenshots of failed tests, and the HTML report.
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # The DIMSE proof of concept against DCMTK's command-line tools (#40): echo
  # and store both ways, with and without TLS. DCMTK is a test peer only, from
  # the runner's package archive; it is never bundled. Not a required check.
  # REQUIRE_DCMTK makes a missing DCMTK a failure here and not a skip.
  # The desktop application, started on each system it is for (#61): Electron
  # on the web client's build, with the page asked what it can reach. The
  # runners have no display on Linux and no GPU on Linux or Windows; what
  # needs a GPU is checked where there is one.
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The package holds no program: Electron's is fetched for this system
      # and checked against the checksums the package carries.
      - name: Fetch Electron
        run: node node_modules/electron/install.js

      - name: Build the web client
        run: npm run build -w @open-rt-studio/web

      - name: Unit tests
        run: npm test -w @open-rt-studio/desktop-bridge -w @open-rt-studio/desktop

      # Ubuntu does not let a program make the user namespace Chromium's
      # sandbox is built on unless it is told to. The test runs with the
      # sandbox, never with --no-sandbox: it is what is being tested.
      - name: Let the sandbox work on the runner
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: End-to-end (on a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e -w @open-rt-studio/desktop

      - name: End-to-end
        if: runner.os != 'Linux'
        run: npm run e2e -w @open-rt-studio/desktop

      - name: Upload what a failed test left
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-results-${{ matrix.name }}
          path: apps/desktop/test-results
          retention-days: 7
          if-no-files-found: ignore

  dimse-interop:
    name: DIMSE interop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install DCMTK
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends dcmtk

      - name: DIMSE tests against DCMTK
        working-directory: services/server
        env:
          REQUIRE_DCMTK: '1'
        run: npx vitest run src/dimse

  # The index in PostgreSQL (#44): the tests every index must pass, and a
  # whole server on it, against a PostgreSQL that the job starts as a service
  # container. It is a test peer here and never bundled. Not a required
  # check. REQUIRE_POSTGRES makes a missing PostgreSQL a failure here and not
  # a skip. The password is of this job's own database, which is gone with
  # the job: it keeps nothing and is reached by nothing else.
  postgres-index:
    name: PostgreSQL index
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: for-this-job-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Index and server tests against PostgreSQL
        working-directory: services/server
        env:
          REQUIRE_POSTGRES: '1'
          OPEN_RT_STUDIO_TEST_POSTGRES: postgresql://postgres:for-this-job-only@127.0.0.1:5432/postgres
        run: npx vitest run src/pacs-index src/postgres-server.spec.ts src/log-identifiers.spec.ts src/ingest/reindex.spec.ts src/reindex-cli.spec.ts

  # The server's container image: built, started as compose.yaml starts it,
  # and checked from outside (healthy, closed without a login, open to an
  # account made by its command, not root, data kept, a clean stop). Not a
  # required check. Nothing is published: the image stays on the runner.
  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, run and check the container
        run: scripts/container-check.sh

  # The server as it is deployed, end to end (#59): its container with its
  # index in PostgreSQL, and DCMTK and Orthanc as other DICOM systems that
  # send to it, ask it and are sent to, asked and retrieved from. Both are
  # test peers: DCMTK is installed on the runner, Orthanc is pulled as its
  # own image, and neither is bundled or linked. Not a required check.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Install DCMTK
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends dcmtk

      - name: Server, PostgreSQL, DCMTK and Orthanc, end to end
        run: scripts/integration-check.sh
