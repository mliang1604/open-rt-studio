<div class="server-head">
  <h2 id="server-panel-title">Server</h2>
  <button type="button" (click)="closed.emit()" title="Close this card">Close</button>
</div>

@if (server(); as connected) {
  <p class="server-state" role="status">Connected: {{ connected.label }}.</p>
  <div class="server-actions">
    <button
      type="button"
      (click)="onDisconnect()"
      title="Go back to opened files. The viewport is emptied"
    >
      Disconnect
    </button>
  </div>
  <app-server-browser
    [server]="connected"
    [chosenKey]="chosenKey()"
    [disabled]="busy()"
    (choose)="onPatient($event)"
  />
} @else {
  <form (submit)="onConnect($event)">
    <label for="server-address">Address of an Open RT Studio server</label>
    <div class="server-row">
      <input
        id="server-address"
        type="text"
        inputmode="url"
        spellcheck="false"
        autocomplete="off"
        [value]="address()"
        (input)="onAddress($event)"
      />
      <button type="submit" [disabled]="busy()">{{ busy() ? 'Connecting…' : 'Connect' }}</button>
    </div>
  </form>
  <p class="server-note">
    Nothing is contacted until you connect. Files you open stay on this computer either way.
  </p>
}

@if (problem(); as message) {
  <p class="server-problem" role="alert">{{ message }}</p>
}
