<aside #panel class="help-panel" tabindex="-1">
  <header class="info-header">
    <strong>Keyboard &amp; mouse shortcuts</strong>
    <button
      type="button"
      class="info-close"
      (click)="closed.emit()"
      title="Close (?)"
      aria-label="Close shortcuts help"
    >
      ✕
    </button>
  </header>
  <dl class="info-body">
    @for (shortcut of shortcuts(); track shortcut.label) {
      <div class="info-row">
        <dt>
          <kbd>{{ shortcut.keys }}</kbd>
        </dt>
        <dd>{{ shortcut.label }}</dd>
      </div>
    }
  </dl>
</aside>
